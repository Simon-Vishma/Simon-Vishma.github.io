<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F19">
<title>A storybook for you</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23E8ECF7' d='M16.5 3.2A9.5 9.5 0 1 0 20.8 17A7.6 7.6 0 0 1 16.5 3.2Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Lora:wght@400;500&family=Mukta:wght@400;600;700&family=Nunito:wght@400;600;700&family=Tinos:ital@1&display=swap">
<style>
:root{
  --ink:#0B0F19; --dusk:#1A233A; --moonmilk:#E8ECF7; --mist:#A9B4CF; --halo:#9FB4E8;
  --ember:#EC8A52; --ember-soft:#F2A57A;
  --blush:#F6D3DB; --lavender:#DCD2F3; --mint:#CDEADF; --butter:#F8E8C2; --sky:#D4E4F8;
  --plum:#3B3552; --paper:#FBF8F4;
  --serif:"IM Fell English","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Nunito","Mukta","Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;
  --times:"Times New Roman",Tinos,Times,"Liberation Serif","Nimbus Roman",serif;
  --read:"Lora","Iowan Old Style",Georgia,serif;
  --moon-size:600px; --node:56px; --char-size:160px;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--ink); color:var(--moonmilk); font-family:var(--sans);
  overflow:hidden; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  transition:background-color 2.2s ease;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--halo);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- night sky ---------- */
.night{position:fixed;inset:0;z-index:0;transition:opacity 2.2s ease}
.sky{
  position:absolute;inset:0;
  background:
    radial-gradient(120% 70% at 90% 110%, rgba(236,138,82,.20), rgba(236,138,82,0) 55%),
    radial-gradient(90% 55% at 8% 108%, rgba(150,96,128,.12), rgba(150,96,128,0) 60%),
    linear-gradient(180deg,#0B0F19 0%,#10172B 48%,#1A233A 100%);
}
.night canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- moon ---------- */
.moon{
  position:fixed;left:0;top:0;width:var(--moon-size);height:var(--moon-size);
  z-index:5;pointer-events:none;transform-origin:50% 50%;will-change:transform;
}
.moon-halo{
  position:absolute;left:50%;top:50%;width:250%;height:250%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(159,180,232,.24) 0%,rgba(159,180,232,.10) 24%,rgba(159,180,232,.035) 42%,rgba(159,180,232,0) 62%);
  opacity:calc(.4 + .6 * var(--lit,.3));
}
.moon-glow{
  position:absolute;left:-20%;top:-20%;width:140%;height:140%;
  filter:blur(calc(var(--moon-size) * .05));opacity:.55;
}
.moon-body{position:absolute;inset:0;width:100%;height:100%}
.moon.zooming{animation:moonZoom var(--mz-dur,2800ms) cubic-bezier(.55,0,.2,1) both}
@keyframes moonZoom{
  from{transform:var(--mz-from);opacity:var(--mz-op,1)}
  to{transform:var(--mz-to);opacity:1}
}

/* ---------- character ---------- */
.character{
  position:fixed;left:0;top:0;width:var(--char-size);height:var(--char-size);z-index:4;
  pointer-events:none;opacity:0;will-change:transform;
  transition:transform .95s cubic-bezier(.34,1.4,.55,1),opacity .4s ease;
}
.character.placed{opacity:1}
.character.back{transition:transform .7s cubic-bezier(.55,0,.8,.3),opacity .4s ease}
.character img{
  width:100%;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 0 16px rgba(159,180,232,.35));
}
.character.out img{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-1.5deg)}}

/* ---------- roses ---------- */
.roses{
  position:fixed;bottom:0;z-index:6;width:clamp(150px,34vw,470px);pointer-events:none;line-height:0;
  transition:opacity 2.2s ease;filter:drop-shadow(0 -1px 1.2px rgba(159,180,232,.22));
}
.roses svg{width:100%;height:auto;display:block;overflow:visible}
.roses-left{left:0}
.roses-right{right:0;transform:scaleX(-1)}
.roses .sway{transform-box:view-box;animation:sway var(--d,9s) ease-in-out var(--dl,0s) infinite alternate}
@keyframes sway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}

/* ---------- gate ---------- */
.gate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px}
.gate.shake{animation:shake .5s}
.gate.broken{pointer-events:none}
.gate.fade-out{opacity:0;transition:opacity .6s ease}
.gate-card{
  position:relative;width:min(420px,100%);padding:34px 30px 28px;border-radius:24px;text-align:center;
  background:linear-gradient(160deg,rgba(232,236,247,.12),rgba(232,236,247,.035) 60%);
  border:1px solid rgba(232,236,247,.16);
  box-shadow:0 40px 90px -40px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
  animation:gateIn 1.3s cubic-bezier(.2,.7,.2,1) .35s both;
}
@keyframes gateIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.gate-crest{width:36px;height:36px;margin:0 auto 18px;display:block;fill:var(--moonmilk);filter:drop-shadow(0 0 10px rgba(159,180,232,.75))}
.gate-q{display:block;font-family:var(--times);font-style:italic;font-weight:400;font-size:clamp(1.45rem,1.2rem + 1vw,1.8rem);line-height:1.3;margin:0 0 20px;text-wrap:balance}
.gate-card input{
  width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(169,180,207,.28);
  background:rgba(8,11,20,.45);color:var(--moonmilk);font:600 1.05rem var(--sans);text-align:center;
  transition:border-color .2s,box-shadow .2s;
}
.gate-card input::placeholder{color:rgba(169,180,207,.55);font-weight:400}
.gate-card input:focus{outline:none;border-color:rgba(159,180,232,.75);box-shadow:0 0 0 4px rgba(159,180,232,.14),0 0 24px rgba(159,180,232,.18)}
.gate-msg{min-height:1.45em;margin:10px 0 14px;font-size:.9rem;line-height:1.45;color:var(--ember-soft)}
.btn-primary{
  appearance:none;border:0;cursor:pointer;padding:14px 26px;border-radius:999px;
  background:linear-gradient(180deg,#F6F8FD,#D6DDEE);color:var(--dusk);font-weight:700;font-size:1rem;letter-spacing:.01em;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 10px 30px -10px rgba(159,180,232,.55);
  transition:transform .15s ease,box-shadow .25s ease;
}
.btn-primary:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),0 12px 38px -8px rgba(159,180,232,.85)}
.btn-primary:active{transform:scale(.98)}
.gate-card .btn-primary{width:100%}
@keyframes shake{
  10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}
  30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}
}
.dust{position:fixed;inset:0;width:100%;height:100%;z-index:11;pointer-events:none}

/* ---------- level nodes ---------- */
.levels{position:fixed;inset:0;z-index:12;pointer-events:none;transition:opacity .35s ease}
.levels.dim{opacity:0}
.levels.dim .node{pointer-events:none}
.node{
  position:absolute;left:0;top:0;width:var(--node);height:var(--node);padding:0;border-radius:50%;
  border:1px solid rgba(232,236,247,.42);
  background:radial-gradient(circle at 35% 30%,rgba(232,236,247,.18),rgba(26,35,58,.6) 70%);
  display:grid;place-items:center;cursor:pointer;
  font-family:var(--serif);font-size:calc(var(--node) * .38);line-height:1;color:var(--moonmilk);
  opacity:0;transform:scale(.6);
  transition:opacity .6s ease calc(var(--i) * .16s),transform .7s cubic-bezier(.34,1.56,.64,1) calc(var(--i) * .16s),background .4s,border-color .4s,color .4s,box-shadow .4s;
}
.levels.show .node{opacity:1;transform:none;pointer-events:auto}
.node-num{position:relative;top:.04em}
.node-label{
  position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);white-space:nowrap;
  font-family:var(--serif);font-style:italic;font-size:clamp(.98rem,.9rem + .3vw,1.12rem);
  color:var(--moonmilk);text-shadow:0 1px 10px rgba(0,0,0,.75);pointer-events:none;transition:opacity .3s,color .3s;
}
.levels.panel-open .node-label{opacity:0}
.node .done-mark{
  position:absolute;right:-5px;bottom:-5px;width:calc(var(--node) * .44);height:calc(var(--node) * .44);
  border-radius:50%;display:grid;place-items:center;transition:opacity .4s,transform .5s cubic-bezier(.34,1.56,.64,1);
  background:var(--dusk);border:1px solid rgba(242,165,122,.6);opacity:0;transform:scale(.4);
}
.node .done-mark svg{width:60%;height:60%;fill:var(--ember-soft)}
.node{transition-property:opacity,transform,background,border-color,color,box-shadow,filter}
.node .fog{
  position:absolute;left:calc(var(--node) * -.5);top:50%;width:calc(var(--node) * 2 + 9.5em);height:calc(var(--node) * 1.9);
  transform:translateY(-50%);border-radius:50%;pointer-events:none;opacity:0;transition:opacity 1.2s ease;
  background:radial-gradient(closest-side,rgba(150,158,176,.42),rgba(150,158,176,.18) 55%,rgba(150,158,176,0));
}
.node.locked{cursor:not-allowed}
.levels.show .node.locked{opacity:.6;filter:blur(2.6px) grayscale(1)}
.node.locked .fog{opacity:1}
.node.locked .node-label{color:var(--mist)}
.node.next{animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{
  0%,100%{box-shadow:0 0 0 0 rgba(159,180,232,0),0 0 16px rgba(159,180,232,.25)}
  50%{box-shadow:0 0 0 7px rgba(159,180,232,.10),0 0 30px rgba(159,180,232,.55)}
}
.node.done{background:radial-gradient(circle at 35% 30%,#F6F8FD,#C4CDE4);color:var(--dusk);border-color:rgba(255,255,255,.8)}
.node.done .done-mark{opacity:1;transform:none}
.node.active{box-shadow:0 0 0 3px rgba(232,236,247,.3),0 0 30px rgba(159,180,232,.5)}
.node.denied{animation:shake .45s}
.node.unlocking{animation:unlockPop 1s cubic-bezier(.34,1.56,.64,1)}
@keyframes unlockPop{
  0%{transform:scale(1)}35%{transform:scale(1.22);box-shadow:0 0 0 10px rgba(159,180,232,.12),0 0 40px rgba(159,180,232,.8)}100%{transform:scale(1)}
}

/* ---------- level 1 panel ---------- */
.panel{
  position:fixed;z-index:12;left:var(--pl);top:var(--pt);width:var(--pw);height:var(--ph);
  display:flex;flex-direction:column;
  background:linear-gradient(160deg,rgba(28,37,62,.66),rgba(11,15,25,.6));
  border:1px solid rgba(232,236,247,.14);
  border-radius:var(--curve) 22px 22px var(--curve) / 50% 22px 22px 50%;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 30px 70px -30px rgba(0,0,0,.85);
  padding:22px 20px 18px calc(18px + var(--curve) * .42);
  opacity:0;transform:translateX(-14px) scale(.98);transform-origin:left center;
  transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1);
}
.panel.open{opacity:1;transform:none}
.panel-head{position:relative;padding-right:40px}
.icon-btn{
  appearance:none;position:absolute;top:-4px;right:-4px;width:34px;height:34px;padding:0;border-radius:50%;
  border:1px solid rgba(232,236,247,.18);background:rgba(11,15,25,.35);display:grid;place-items:center;cursor:pointer;
}
.icon-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;stroke-linecap:round;fill:none}
.list{
  list-style:none;margin:6px -8px 0 0;padding:0 8px 0 0;flex:1;min-height:0;overflow-y:auto;outline:none;
  scrollbar-width:thin;scrollbar-color:rgba(169,180,207,.3) transparent;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14px,#000 calc(100% - 26px),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 14px,#000 calc(100% - 26px),transparent 100%);
}
.list:focus-visible{outline:2px solid var(--halo);outline-offset:4px}
.row{padding:12px 4px 12px 2px;border-bottom:1px solid rgba(232,236,247,.09);font-family:var(--read);font-size:1.1rem;line-height:1.45;color:var(--moonmilk)}
.row:first-child{padding-top:10px}
.row:last-child{border-bottom:0;padding-bottom:18px}
.row-text{display:block;margin-top:4px;font-family:var(--sans);font-size:.94rem;line-height:1.55;color:#C3CBE0}
.panel-head{position:relative;height:26px;padding:0}
.panel-foot{display:flex;align-items:center;justify-content:flex-end;padding-top:14px}
.btn-complete{
  appearance:none;border:0;cursor:pointer;padding:11px 26px;border-radius:999px;
  font-family:var(--sans);font-weight:700;font-size:1rem;letter-spacing:.01em;color:#2A1509;
  background:linear-gradient(180deg,#F5B38C,#EC8A52);box-shadow:0 0 22px rgba(236,138,82,.35);transition:box-shadow .25s,transform .15s;
}
.btn-complete:hover{box-shadow:0 0 30px rgba(236,138,82,.6)}
.btn-complete:active{transform:scale(.98)}

/* ---------- speech bubble ---------- */
.bubble{
  position:fixed;z-index:14;left:0;top:0;max-width:340px;padding:14px 18px 15px;
  background:linear-gradient(180deg,#F7F8FD,#E2E7F4);color:var(--dusk);
  border-radius:20px 20px 20px 6px;font:600 1.02rem/1.45 var(--sans);cursor:pointer;user-select:none;
  box-shadow:0 18px 40px -18px rgba(0,0,0,.75),0 0 30px rgba(159,180,232,.22);
  opacity:0;transform:translateY(8px) scale(.94);transform-origin:left bottom;
  transition:opacity .3s ease,transform .45s cubic-bezier(.34,1.56,.64,1);
}
.bubble.show{opacity:1;transform:none}
.bubble::after{
  content:"";position:absolute;left:12px;bottom:-10px;width:20px;height:12px;background:#E2E7F4;
  clip-path:polygon(0 0,100% 0,0 100%);
}
.bubble.side{border-radius:20px;transform-origin:left center}
.bubble.side::after{left:-9px;bottom:auto;top:calc(45% - 8px);width:11px;height:16px;clip-path:polygon(100% 0,100% 100%,0 50%);background:#ECEFF8}
.bubble-next{
  position:absolute;right:14px;bottom:-11px;width:22px;height:22px;border-radius:50%;
  background:var(--dusk);border:1px solid rgba(232,236,247,.55);display:grid;place-items:center;
  opacity:0;transform:scale(.6);transition:opacity .25s,transform .3s cubic-bezier(.34,1.56,.64,1);
}
.bubble-next svg{width:12px;height:12px;stroke:var(--moonmilk);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.bubble.waiting .bubble-next{opacity:1;transform:none;animation:nudge 1.3s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(3px)}}
.bubble .ghost{visibility:hidden}
.bubble .typed{position:absolute;left:18px;top:14px;right:18px}

/* ---------- level 2 timeline ---------- */
.timeline{
  position:fixed;inset:0;z-index:20;
  background:linear-gradient(180deg,rgba(9,12,22,.8),rgba(22,30,52,.76));
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;transition:opacity .5s ease;
}
.timeline.open{opacity:1}
.timeline::before{
  content:"";position:absolute;z-index:1;left:0;right:0;top:0;height:calc(72px + env(safe-area-inset-top,0px));pointer-events:none;
  background:linear-gradient(180deg,rgba(9,12,22,.96) 40%,rgba(9,12,22,0));
}
.tl-scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.tl-back{
  appearance:none;position:absolute;z-index:2;top:calc(14px + env(safe-area-inset-top,0px));left:14px;
  display:inline-flex;align-items:center;gap:6px;padding:9px 16px 9px 12px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(232,236,247,.2);background:rgba(11,15,25,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  font-weight:600;font-size:.9rem;
}
.tl-back svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tl-head{max-width:640px;margin:0 auto;padding:86px 24px 8px;text-align:center}
.tl-head h2{font-family:var(--serif);font-weight:400;font-size:clamp(2.1rem,1.4rem + 2.8vw,3.4rem);line-height:1.08;margin:0 0 12px}
.tl-head p{margin:0;color:var(--mist);font-size:1rem;line-height:1.55}
.tl-track{position:relative;max-width:980px;margin:calc(84px + env(safe-area-inset-top,0px)) auto 0;padding:10px 24px 30px}
.tl-line{
  position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:linear-gradient(180deg,rgba(232,236,247,0),rgba(232,236,247,.32) 5%,rgba(232,236,247,.32) 95%,rgba(232,236,247,0));
}
.tl-comet{
  position:absolute;left:0;top:0;width:9px;height:9px;margin:-4.5px 0 0 -4px;border-radius:50%;background:#fff;
  box-shadow:0 0 10px 3px rgba(159,180,232,.85),0 0 26px 8px rgba(159,180,232,.3);
  transform:translateY(var(--comet,0px));
}
.tl-comet::before{
  content:"";position:absolute;left:3.5px;bottom:4px;width:2px;height:90px;
  background:linear-gradient(0deg,rgba(232,236,247,.85),rgba(232,236,247,0));border-radius:2px;
}
.tl-item{position:relative;width:50%;padding:0 46px 56px 0}
.tl-item:nth-child(even){margin-left:50%;padding:0 0 56px 46px}
@media (min-width:721px){.tl-item+.tl-item{margin-top:-44px}}
.tl-dot{position:absolute;top:24px;right:-9px;width:18px;height:18px}
.tl-item:nth-child(even) .tl-dot{right:auto;left:-9px}
.tl-dot svg{width:100%;height:100%;display:block;fill:var(--ink);stroke:rgba(232,236,247,.55);stroke-width:1.3;transition:fill .6s,stroke .6s,filter .6s}
.tl-item.in .tl-dot svg{fill:var(--moonmilk);stroke:var(--moonmilk);filter:drop-shadow(0 0 6px rgba(159,180,232,.9))}
.tl-card{
  padding:20px 22px 22px;border-radius:18px 18px 18px 6px;
  background:linear-gradient(160deg,rgba(232,236,247,.1),rgba(232,236,247,.03));
  border:1px solid rgba(232,236,247,.13);box-shadow:0 24px 50px -30px rgba(0,0,0,.9);
  opacity:0;transform:translateY(36px) scale(.97);
  transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.8,.2,1);
}
.tl-item:nth-child(odd) .tl-card{border-radius:18px 18px 6px 18px}
.tl-item.in .tl-card{opacity:1;transform:none}
.tl-item.in .tl-float{animation:drift 7s ease-in-out var(--fd,0s) infinite}
@keyframes drift{50%{transform:translateY(-6px)}}
.tl-date{font-family:var(--serif);font-style:italic;color:var(--ember-soft);font-size:1.05rem;margin:0 0 4px}
.tl-title{font-family:var(--serif);font-weight:400;font-size:1.5rem;line-height:1.2;margin:0 0 8px}
.tl-text{margin:0;color:#C6CEE2;font-size:.98rem;line-height:1.62}
.tl-text--lead{font-family:var(--serif);font-size:1.2rem;line-height:1.45;color:var(--moonmilk)}
.tl-foot{text-align:center;padding:24px 24px calc(90px + env(safe-area-inset-bottom,0px))}
.tl-foot p{font-family:var(--serif);font-style:italic;font-size:clamp(1.2rem,1rem + .8vw,1.5rem);margin:0 auto 22px;max-width:30ch;line-height:1.35}

/* ---------- countdown ---------- */
.countdown{
  position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;
  background:rgba(4,6,12,.97);opacity:0;transition:opacity .6s ease;
}
.countdown.show{opacity:1}
.countdown.fade{opacity:0;transition:opacity 1.5s ease}
.cd-card{text-align:center;max-width:440px}
.cd-text{text-wrap:balance;font-family:var(--serif);font-style:italic;font-size:clamp(1.35rem,1rem + 1.4vw,1.9rem);line-height:1.3;margin:0 0 32px;min-height:2.6em;transition:opacity .5s}
.cd-ring{position:relative;width:140px;height:140px;margin:0 auto;transition:opacity .6s,transform .6s}
.cd-ring.gone{opacity:0;transform:scale(.85)}
.cd-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.cd-ring circle{fill:none;stroke-width:2.5}
.cd-ring .bg{stroke:rgba(232,236,247,.12)}
.cd-ring .fg{stroke:var(--moonmilk);stroke-linecap:round;stroke-dasharray:364.42;stroke-dashoffset:0}
.cd-ring.run .fg{transition:stroke-dashoffset 3s linear;stroke-dashoffset:364.42}
.cd-num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:3.6rem;line-height:1}

.lapse{
  position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:64px 16px 24px;
  background:rgba(40,34,58,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  opacity:0;transition:opacity .3s ease;
}
.lapse.open{opacity:1}
.lapse-frame{
  width:min(1000px,100%,calc((100vh - 110px) * 16 / 9));aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;
  box-shadow:0 40px 90px -30px rgba(20,16,36,.75);transform:translateY(12px) scale(.98);transition:transform .35s cubic-bezier(.2,.8,.2,1);

.lapse .lapse-close{

.sound{

/* =====================================================================
   SKY: seeded milky-way haze, twinkling stars, drifting clouds
   ===================================================================== */
const Sky = (() => {
  const stat = $('#skyStatic'), live = $('#skyLive');
  const sctx = stat.getContext('2d'), lctx = live.getContext('2d');
  let stars = [], clouds = [], shooting = [], nextShoot = 5000, running = true, glint;

  function makeGlint() {
    const c = document.createElement('canvas'), s = 64; c.width = c.height = s;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(.1, 'rgba(225,233,255,.7)');
    grd.addColorStop(.35, 'rgba(159,180,232,.12)'); grd.addColorStop(1, 'rgba(159,180,232,0)');
    g.fillStyle = grd; g.fillRect(0, 0, s, s);
    g.globalCompositeOperation = 'lighter';
    for (const horiz of [true, false]) {
      const lg = horiz ? g.createLinearGradient(0, 0, s, 0) : g.createLinearGradient(0, 0, 0, s);
      lg.addColorStop(0, 'rgba(200,215,255,0)'); lg.addColorStop(.5, 'rgba(235,240,255,.9)'); lg.addColorStop(1, 'rgba(200,215,255,0)');
      g.fillStyle = lg;
      horiz ? g.fillRect(0, s / 2 - 1, s, 2) : g.fillRect(s / 2 - 1, 0, 2, s);
    }
    return c;
  }

  function band(t) {
    const tall = H > W;
    return [lerp(tall ? -.25 * W : -.05 * W, tall ? .95 * W : .36 * W, t) + Math.sin(t * 3.1) * .03 * W, lerp(1.02 * H, -.06 * H, t)];
  }

  function drawStatic() {
    const r = mulberry32(7), g = sctx;
    g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H);
    const bw = Math.min(W, H) * .1 + Math.max(W, H) * .035;
    for (let i = 0; i < 150; i++) {
      const [x, y] = band(r()); const off = (r() - .5) * bw * 1.6;
      const gx = x + off * .85, gy = y + off * .4, rad = bw * (.3 + r() * .9);
      const a = .014 + r() * .026, hue = r() < .3 ? '190,168,228' : '148,172,232';
      const grd = g.createRadialGradient(gx, gy, 0, gx, gy, rad);
      grd.addColorStop(0, `rgba(${hue},${a})`); grd.addColorStop(1, `rgba(${hue},0)`);
      g.fillStyle = grd; g.fillRect(gx - rad, gy - rad, rad * 2, rad * 2);
    }
    const n = Math.round(W * H / 650);
    for (let i = 0; i < n; i++) {
      let x, y;
      if (r() < .5) { [x, y] = band(r()); const off = (r() + r() + r() - 1.5) * bw * 1.2; x += off * .9; y += off * .45; }
      else { x = r() * W; y = r() * H * .92; }
      g.fillStyle = `rgba(215,225,250,${(.12 + r() * .4).toFixed(3)})`;
      const s = r() < .9 ? .6 : 1.1; g.fillRect(x, y, s, s);
    }
  }

  function makeStars() {
    const r = mulberry32(42), n = Math.min(620, Math.round(W * H / 2300));
    stars = [];
    for (let i = 0; i < n; i++) {
      stars.push({
        x: r() * W, y: Math.pow(r(), 1.35) * H * .92, rad: .35 + Math.pow(r(), 3) * 1.25,
        a: .35 + r() * .6, sp: .6 + r() * 2.2, ph: r() * 6.283,
        tint: r() < .15 ? '255,236,214' : (r() < .5 ? '214,226,255' : '255,255,255'), glint: r() < .025
      });
    }
  }

  function cloudSprite(r, w, h, warm) {
    const pad = Math.round(h * 1.05 + 12), c = document.createElement('canvas');
    c.width = Math.round(w + pad * 2); c.height = Math.round(h + pad * 2);
    const g = c.getContext('2d'), puffs = [], n = 10 + Math.floor(r() * 8);
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1), hump = Math.sin(t * Math.PI);
      const pr = h * (.26 + hump * .42) * (.7 + r() * .5);
      puffs.push([pad + t * w + (r() - .5) * w * .08, pad + h - pr * .85 - r() * h * .12, pr]);
    }
    const rim = warm ? '236,138,82' : '112,132,184';
    for (const [x, y, pr] of puffs) {
      const yy = y - pr * .2, grd = g.createRadialGradient(x, yy, pr * .2, x, yy, pr * 1.06);
      grd.addColorStop(0, `rgba(${rim},${warm ? .5 : .2})`); grd.addColorStop(1, `rgba(${rim},0)`);
      g.fillStyle = grd; g.beginPath(); g.arc(x, yy, pr * 1.06, 0, 6.283); g.fill();
    }
    for (const [x, y, pr] of puffs) {
      const yy = y + pr * .1, grd = g.createRadialGradient(x, yy, 0, x, yy, pr);
      grd.addColorStop(0, 'rgba(9,12,22,.95)'); grd.addColorStop(.6, 'rgba(12,16,29,.85)'); grd.addColorStop(1, 'rgba(14,19,34,0)');
      g.fillStyle = grd; g.beginPath(); g.arc(x, yy, pr, 0, 6.283); g.fill();
    }
    return c;
  }

  function makeClouds() {
    const r = mulberry32(99), n = W > 900 ? 6 : 4;
    clouds = [];
    for (let i = 0; i < n; i++) {
      const w = clamp(W * (.3 + r() * .35), 220, 760), h = w * (.16 + r() * .1);
      const y = H * (.42 + (i / n) * .44 + r() * .06);
      const img = cloudSprite(r, w, h, false);
      clouds.push({ img, x: r() * (W + img.width) - img.width, y, v: 3 + r() * 6, a: .55 + r() * .3 });
    }
    const w = clamp(W * .5, 260, 820), img = cloudSprite(r, w, w * .2, true);
    clouds.push({ img, x: W * .58, y: H * .8, v: 2.2, a: .75 });
  }

  function resize() {
    for (const c of [stat, live]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
    drawStatic(); makeStars(); makeClouds();
  }

  function frame(t, dt) {
    if (!running) return;
    const g = lctx, ts = t / 1000;
    g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H);
    for (const s of stars) {
      const tw = reduceMotion ? .8 : .6 + .4 * Math.sin(ts * s.sp + s.ph), a = s.a * tw;
      if (s.glint) {
        const sz = (9 + s.rad * 9) * (.75 + .25 * tw);
        g.globalAlpha = a; g.drawImage(glint, s.x - sz / 2, s.y - sz / 2, sz, sz); g.globalAlpha = 1;
      } else {
        g.fillStyle = `rgba(${s.tint},${a.toFixed(3)})`;
        g.beginPath(); g.arc(s.x, s.y, s.rad, 0, 6.283); g.fill();
      }
    }
    if (!reduceMotion) {
      nextShoot -= dt;
      if (nextShoot < 0) {
        nextShoot = 7000 + Math.random() * 9000;
        const dir = Math.random() < .5 ? -1 : 1, sp = W * .35 + 220;
        shooting.push({ x: W * (.2 + Math.random() * .6), y: H * (.04 + Math.random() * .22), vx: dir * sp, vy: sp * .42, life: 0, max: 850 + Math.random() * 400, len: 90 + Math.random() * 110 });
      }
      g.lineCap = 'round';
      shooting = shooting.filter(s => {
        s.life += dt; s.x += s.vx * dt / 1000; s.y += s.vy * dt / 1000;
        const p = s.life / s.max; if (p >= 1) return false;
        const a = Math.sin(p * Math.PI), m = Math.hypot(s.vx, s.vy);
        const tx = s.x - s.vx / m * s.len, ty = s.y - s.vy / m * s.len;
        const lg = g.createLinearGradient(s.x, s.y, tx, ty);
        lg.addColorStop(0, `rgba(240,244,255,${(.9 * a).toFixed(3)})`); lg.addColorStop(1, 'rgba(159,180,232,0)');
        g.strokeStyle = lg; g.lineWidth = 1.4; g.beginPath(); g.moveTo(s.x, s.y); g.lineTo(tx, ty); g.stroke();
        return true;
      });
    }
    for (const c of clouds) {
      if (!reduceMotion) { c.x += c.v * dt / 1000; if (c.x > W + 10) c.x = -c.img.width; }
      g.globalAlpha = c.a; g.drawImage(c.img, c.x, c.y - c.img.height / 2); g.globalAlpha = 1;
    }
  }

  return {
    init() { glint = makeGlint(); resize(); },
    resize, frame,
    sprite: () => glint,
    stop() { running = false; }
  };
})();

/* =====================================================================
   MOON: photo texture + soft terminator shadow drawn on canvas
   ===================================================================== */
const Moon = (() => {
  const body = $('#moonBody'), glow = $('#moonGlow');
  const b = body.getContext('2d'), gl = glow.getContext('2d');
  const mask = document.createElement('canvas'); mask.width = mask.height = 256;
  const m = mask.getContext('2d');
  const tex = new Image(); let texReady = false;
  let S = 400, res = 0, k = .3, lastDrawn = -1;
  const api = { mode: 'arc', cur: null, zoom: null };
  const bright = clamp(MOON_BRIGHTNESS, .3, 1);

  function addShadow(ctx, cx, cy, R, E, kk) {
    ctx.moveTo(cx, cy - E);
    ctx.arc(cx, cy, E, -Math.PI / 2, Math.PI / 2, false);
    ctx.lineTo(cx, cy + R);
    if (kk <= .5) ctx.ellipse(cx, cy, Math.max(R * (1 - 2 * kk), .01), R, 0, Math.PI / 2, Math.PI * 1.5, false);
    else ctx.ellipse(cx, cy, Math.max(R * (2 * kk - 1), .01), R, 0, Math.PI / 2, -Math.PI / 2, true);
    ctx.lineTo(cx, cy - E); ctx.closePath();
  }

  function drawMask(kk) {
    const c = 128, R = 128 / 1.22, E = R * 1.12, off = 700;
    m.setTransform(1, 0, 0, 1, 0, 0); m.clearRect(0, 0, 256, 256);
    if (kk >= .995) return;
    m.save();
    m.shadowColor = 'rgba(7,11,24,.94)'; m.shadowBlur = R * .032; m.shadowOffsetX = off;
    m.translate(-off, 0); m.fillStyle = '#000';
    m.beginPath(); addShadow(m, c, c, R, E, kk); m.fill();
    m.restore();
  }

  function draw(kk, force) {
    k = kk;
    if (!res || (!force && Math.abs(k - lastDrawn) < .004)) return;
    lastDrawn = k;
    drawMask(k);
    const c = res / 2, R = c * .985, mR = R * 1.22;
    b.setTransform(1, 0, 0, 1, 0, 0); b.clearRect(0, 0, res, res);
    b.save(); b.beginPath(); b.arc(c, c, R, 0, Math.PI * 2); b.clip();
    if (texReady) b.drawImage(tex, 0, 0, res, res);
    else { const g = b.createRadialGradient(c * .8, c * .8, 0, c, c, R); g.addColorStop(0, '#E9EDF6'); g.addColorStop(1, '#AAB3C8'); b.fillStyle = g; b.fillRect(0, 0, res, res); }
    // tone the photo down so it sits in the night instead of glaring
    b.fillStyle = `rgba(14,20,38,${(1 - bright).toFixed(3)})`; b.fillRect(0, 0, res, res);
    // gentle limb darkening for depth
    const ld = b.createRadialGradient(c * .96, c * .96, R * .55, c, c, R);
    ld.addColorStop(0, 'rgba(10,14,28,0)'); ld.addColorStop(1, 'rgba(10,14,28,.28)');
    b.fillStyle = ld; b.fillRect(0, 0, res, res);
    b.drawImage(mask, c - mR, c - mR, mR * 2, mR * 2);
    b.restore();
    b.beginPath(); b.arc(c, c, R - res * .002, 0, Math.PI * 2);
    b.lineWidth = Math.max(1, res * .003); b.strokeStyle = 'rgba(190,205,240,.13)'; b.stroke();

    const gs = glow.width, gc = gs / 2, gR = gc / 1.4 * .985, gmR = gR * 1.22;
    gl.setTransform(1, 0, 0, 1, 0, 0); gl.globalCompositeOperation = 'source-over'; gl.clearRect(0, 0, gs, gs);
    gl.fillStyle = 'rgba(196,212,250,1)'; gl.beginPath(); gl.arc(gc, gc, gR, 0, Math.PI * 2); gl.fill();
    gl.globalCompositeOperation = 'destination-out'; gl.drawImage(mask, gc - gmR, gc - gmR, gmR * 2, gmR * 2);
    gl.globalCompositeOperation = 'source-over';
    moonEl.style.setProperty('--lit', k.toFixed(3));
  }

  api.init = () => {
    tex.onload = () => { texReady = true; draw(k, true); };
    if (window.MOON_TEXTURE) tex.src = window.MOON_TEXTURE;
  };
  api.setSize = (size, resolution) => {
    S = size; moonEl.style.setProperty('--moon-size', S + 'px');
    const r = clamp(Math.round(resolution), 64, 1400);
    if (r !== res) { res = r; body.width = body.height = res; glow.width = glow.height = Math.round(res * .7); lastDrawn = -1; draw(k, true); }
  };
  api.transformStr = (x, y, rot, sc) => `translate3d(${(x - S / 2).toFixed(2)}px, ${(y - S / 2).toFixed(2)}px, 0) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(4)})`;
  api.place = (x, y, rot, sc) => { const str = api.transformStr(x, y, rot, sc); moonEl.style.transform = str; api.cur = str; };
  api.draw = draw;
  Object.defineProperties(api, { k: { get: () => k }, S: { get: () => S } });
  return api;
})();

function arcParams() {
  const land = W >= H * .95;
  return { small: clamp(Math.min(W, H) * .15, 66, 132), baseY: land ? .58 * H : .42 * H, apexY: land ? .15 * H : .10 * H };
}
function arcUpdate(t) {
  const { small, baseY, apexY } = arcParams();
  const p = reduceMotion ? .42 : ((t / 48000) + .28) % 1, th = p * Math.PI, sn = Math.sin(th);
  const x = W / 2 - (W / 2 + small * .8) * Math.cos(th), y = baseY - (baseY - apexY) * sn;
  Moon.place(x, y, -22 * Math.cos(th), small / Moon.S);
  moonEl.style.opacity = clamp(sn / .16, 0, 1).toFixed(3);
  Moon.draw(.24 + .64 * (1 - sn));
}

/* ---------------- stage 1 geometry ---------------- */
function layout1() {
  const portrait = H > W * 1.05;
  let S, cx, cy, k;
  if (portrait) { S = Math.min(W * .92, H * .56, 560); cx = Math.max(S / 2 + 8, W * .47); cy = H * .53; k = .16; }
  else { S = Math.min(H * .74, W * .52, 680); cx = Math.max(S / 2 + 24, W * .36); cy = H * .52; k = .2; }
  const R = S / 2 * .985, a = R * (1 - 2 * k);
  return { portrait, S, cx, cy, k, R, a, edge: y => cx - a * Math.sqrt(Math.max(0, 1 - ((y - cy) / R) ** 2)) };
}

function placeStage1() {
  const L = layout1(); state.L = L;
  Moon.setSize(L.S, L.S * DPR);
  if (Moon.mode === 'fixed') { Moon.place(L.cx, L.cy, 0, 1); Moon.draw(L.k, true); }
  const node = clamp(L.S * .1, 36, 62), gap = clamp(L.S * .04, 10, 26);
  document.documentElement.style.setProperty('--node', node + 'px');
  let maxX = 0;
  [-.44, 0, .44].forEach((f, i) => {
    const y = L.cy + f * L.R, x = L.edge(y) + node / 2 + gap;
    maxX = Math.max(maxX, x);
    if (nodes[i]) { nodes[i].style.left = (x - node / 2) + 'px'; nodes[i].style.top = (y - node / 2) + 'px'; }
  });
  const left = L.portrait ? Math.max(12, L.edge(L.cy) - 30) : maxX + node / 2 + clamp(L.S * .03, 10, 22);
  const right = L.portrait ? W - 12 : Math.min(W - 16, Math.max(L.cx + L.R + L.S * .3, left + 400));
  const h = Math.min(L.portrait ? Math.max(L.S * 1.5, H * .62) : L.S * .9, H - (L.portrait ? 110 : 40));
  const top = clamp(L.cy - h / 2, 20, H - 20 - h);
  const w = right - left, curve = Math.min(w * .2, h * .22, 110);
  Object.entries({ '--pl': left, '--pt': top, '--pw': w, '--ph': h, '--curve': curve })
    .forEach(([k, v]) => panel.style.setProperty(k, v + 'px'));

}

function charGeom(out) {
  const L = state.L, s = clamp(L.S * .3, 92, 210);
  if (!out) return { s, x: L.cx, y: L.cy, rot: 0, sc: .8 };
  const ang = (L.portrait ? -128 : -52) * Math.PI / 180, d = L.R + s * .16;
  return { s, x: L.cx + Math.cos(ang) * d, y: L.cy + Math.sin(ang) * d, rot: L.portrait ? -12 : 12, sc: 1 };
}
function placeCharacter(out) {
  if (!state.L) return;
  const g = charGeom(out);
  charEl.style.setProperty('--char-size', g.s + 'px');
  charEl.style.transform = `translate3d(${(g.x - g.s / 2).toFixed(1)}px, ${(g.y - g.s / 2).toFixed(1)}px, 0) rotate(${g.rot}deg) scale(${g.sc})`;
  return g;
}

/* ---------------- main loop ---------------- */
let lastT = performance.now();
function loop(t) {
  const dt = Math.min(64, t - lastT); lastT = t;
  if (!state.daylight) Sky.frame(t, dt);
  if (Moon.mode === 'arc') arcUpdate(t);
  else if (Moon.mode === 'zoom') {
    const z = Moon.zoom, p = clamp((t - z.t0) / z.dur, 0, 1);
    Moon.draw(lerp(z.fromK, z.toK, easeInOut(p)));
    if (p >= 1) {
      Moon.mode = 'fixed'; moonEl.classList.remove('zooming'); Moon.draw(z.toK, true);
      if (state.pendingResize) { state.pendingResize = false; placeStage1(); }
    }
  }
  if (!state.daylight || Moon.mode !== 'fixed') requestAnimationFrame(loop);
}

/* =====================================================================
   ROSES: silhouettes built from stems, leaves, thorns and blooms

function buildRoses(host, pre, seed, variant) {

    <g id="${pre}bloom"><path d="M0 0C-4-2-9-2-13 1-9-4-4-6 0-5 4-6 9-4 13 1 9-2 4-2 0 0Z"/>
      <path d="M-15-14C-18-22-14-31-6-33-3-38 5-38 8-33 15-32 19-24 16-15 15-8 8-4 0-4-8-4-14-8-15-14Z"/>
      <path d="M-15-14C-20-16-21-22-17-25-17-20-15-17-12-16ZM16-15C21-17 22-23 18-26 18-21 16-18 13-17Z"/>
      <path d="M-11-19C-6-14 5-14 11-19M-8-27C-4-31 3-31 7-27M-2-33C-6-28-4-23 1-23 5-23 6-28 3-32M-14-15C-10-9-4-7 1-8" fill="none" stroke="#182038" stroke-width=".9" stroke-linecap="round"/></g>
    <g id="${pre}bud"><path d="M0 0C-3-3-6-6-7-11-4-8-2-6 0-5 2-6 4-8 7-11 6-6 3-3 0 0Z"/><path d="M0-2C-5-6-6-14 0-22 6-14 5-6 0-2Z"/><path d="M0-4C-2-9-2-14 0-19" fill="none" stroke="#182038" stroke-width=".8"/></g>
    <path id="${pre}thorn" d="M0-1.2L6-2.6 0 1.4Z"/>
  </defs><g class="rose-root" fill="#03050B"></g>`;
  host.appendChild(svg);
  const root = svg.querySelector('.rose-root');
  if (variant) root.setAttribute('transform', 'translate(8 22) scale(.94)');
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const a in attrs) e.setAttribute(a, attrs[a]); (parent || root).appendChild(e); return e; };
  const use = (id, tr, parent) => mk('use', { href: `#${pre}${id}`, transform: tr }, parent);
  const angAt = (p, len, L) => { const a = p.getPointAtLength(Math.max(0, len - 1)), b2 = p.getPointAtLength(Math.min(L, len + 1)); return Math.atan2(b2.y - a.y, b2.x - a.x) * 180 / Math.PI; };

  const stems = [
    ['M34 320C38 262 20 206 40 146C52 108 72 86 94 70', 1, 5, 'bloom', 1.15, 3.4],
    ['M74 320C80 270 100 226 130 196C150 176 170 166 192 158', 1, 4, 'bloom', 1, 3],
    ['M16 320C8 280 6 238 16 200', 1, 2, 'bud', .85, 2.4],
    ['M110 320C114 290 138 262 172 250', 1, 2, 'bud', .8, 2.2],
    ['M54 320C60 276 70 240 64 196C60 172 50 156 42 140', 1, 3, 'bud', .8, 2.2],
    ['M150 320C170 302 206 292 246 292', 0, 3, 'bloom', .75, 2]
  ];
  const vines = [
    ['M0 262C18 244 8 218 26 198C42 180 34 158 52 140C64 128 62 112 72 102', 7],
    ['M138 318C180 304 220 314 262 304C296 296 318 304 352 296C374 290 390 296 408 290', 9]
  ];
  mk('path', { d: 'M0 320V292C20 286 34 296 52 290C74 282 94 294 118 288C150 280 180 296 214 292C250 288 280 300 320 300C360 302 390 310 420 314V320Z' });

  stems.forEach(([d, thorny, leaves, end, sc, w], si) => {
    const m0 = d.match(/M([\d.]+)\s*([\d.]+)/);
    const g = mk('g', { class: 'sway' });
    g.style.transformOrigin = `${m0[1]}px ${m0[2]}px`;
    g.style.setProperty('--d', (7 + r() * 5).toFixed(1) + 's');
    g.style.setProperty('--dl', (-r() * 6).toFixed(1) + 's');
    const p = mk('path', { d, fill: 'none', stroke: '#03050B', 'stroke-width': w, 'stroke-linecap': 'round' }, g);
    const L = p.getTotalLength();
    for (let i = 0; i < leaves; i++) {
      const t = .22 + (leaves > 1 ? i / (leaves - 1) : .5) * .6 + (r() - .5) * .05;
      const pt = p.getPointAtLength(L * t), ang = angAt(p, L * t, L), side = (i + si) % 2 ? 1 : -1;

    }
    if (thorny) {
      const n = Math.floor(L / 20);
      for (let i = 0; i < n; i++) {
        const len = L * ((i + .5) / n) * .88, pt = p.getPointAtLength(len), ang = angAt(p, len, L), side = i % 2 ? 1 : -1;
        const nr = (ang + side * 90) * Math.PI / 180, ox = Math.cos(nr) * w * .4, oy = Math.sin(nr) * w * .4;
        use('thorn', `translate(${(pt.x + ox).toFixed(1)} ${(pt.y + oy).toFixed(1)}) rotate(${(ang + 180 - side * 60).toFixed(1)}) scale(${(.9 * sc).toFixed(2)})`, g);
      }
    }
    const tip = p.getPointAtLength(L), ta = angAt(p, L, L);
    use(end, `translate(${tip.x.toFixed(1)} ${tip.y.toFixed(1)}) rotate(${((ta + 90) * .55).toFixed(1)}) scale(${sc})`, g);
  });

  vines.forEach(([d, leaves]) => {
    const g = mk('g', { class: 'sway' });
    const m0 = d.match(/M([\d.]+)\s*([\d.]+)/);
    g.style.transformOrigin = `${m0[1]}px ${m0[2]}px`;
    g.style.setProperty('--d', (9 + r() * 5).toFixed(1) + 's');
    const p = mk('path', { d, fill: 'none', stroke: '#03050B', 'stroke-width': 1.5, 'stroke-linecap': 'round' }, g);
    const L = p.getTotalLength();
    for (let i = 0; i < leaves; i++) {
      const len = L * (.08 + i / leaves * .9), pt = p.getPointAtLength(len), ang = angAt(p, len, L), side = i % 2 ? 1 : -1;
      use('leaf', `translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)}) rotate(${(ang + side * 55).toFixed(1)}) scale(${(.42 + r() * .18).toFixed(2)})`, g);
    }

    mk('path', { d: `M${tip.x.toFixed(1)} ${tip.y.toFixed(1)}Q${(cx + 4).toFixed(1)} ${(cy - 6).toFixed(1)} ${(cx - 1).toFixed(1)} ${(cy - 7).toFixed(1)}T${(cx - 3).toFixed(1)} ${(cy - 2).toFixed(1)}`, fill: 'none', stroke: '#03050B', 'stroke-width': 1, 'stroke-linecap': 'round' }, g);
  });
}

/* =====================================================================
   STAGE 0: gate, music, shatter, zoom
   ===================================================================== */
function normalise(s) {
  return String(s).normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
    .replace(/[^\p{L}\p{N}\p{M}]+/gu, ' ').trim();
}

let fadeId = 0;
function fadeVolume(to, ms, done) {
  const id = ++fadeId, from = audio.volume, t0 = performance.now();
  (function step(t) {
    if (id !== fadeId) return;
    const p = clamp((t - t0) / ms, 0, 1);
    try { audio.volume = clamp(lerp(from, to, p), 0, 1); } catch (e) {}
    if (p < 1) requestAnimationFrame(step); else if (done) done();
  })(t0);
}
function setSoundIcon(on) {
  soundBtn.innerHTML = on ? SOUND_ON : SOUND_OFF;
  soundBtn.setAttribute('aria-label', on ? 'Mute music' : 'Play music');
}
function startMusic() {
  try {
    audio.volume = 0;
    const p = audio.play();
    const ok = () => { fadeVolume(MUSIC_VOLUME, 2500); soundBtn.hidden = false; setSoundIcon(true); };
    if (p && p.then) p.then(ok).catch(err => console.info('Music did not start:', err && err.message));
    else ok();
  } catch (e) { console.info('Music did not start:', e.message); }
}
soundBtn.addEventListener('click', () => {
  if (audio.paused) { audio.volume = 0; audio.play().then(() => fadeVolume(MUSIC_VOLUME, 900)).catch(() => {}); setSoundIcon(true); }
  else { fadeVolume(0, 500, () => audio.pause()); setSoundIcon(false); }
});

gateCard.addEventListener('submit', (e) => {
  e.preventDefault();
  if (state.opening) return;
  const v = normalise(input.value);
  if (!v) { gateMsg.textContent = EMPTY_ANSWER_MSG; shakeGate(); input.focus(); return; }
  if (CORRECT_ANSWERS.map(normalise).includes(v)) {
    state.opening = true;
    startMusic();                       // called directly inside the click/submit gesture
    input.blur();
    openStorybook();
  } else {
    state.misses++;
    gateMsg.textContent = state.misses >= 2 ? `${WRONG_ANSWER_MSG} ${LOGIN_HINT}` : WRONG_ANSWER_MSG;
    shakeGate(); input.select();
  }
});
function shakeGate() { gate.classList.remove('shake'); void gate.offsetWidth; gate.classList.add('shake'); }

function dissolveGate() {
  const rect = gateCard.getBoundingClientRect();
  gate.classList.add('broken');
  gateCard.style.animation = 'none';
  if (reduceMotion) { gate.classList.add('fade-out'); setTimeout(() => gate.remove(), 700); return; }

  const cv = document.createElement('canvas'); cv.className = 'dust';
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  document.body.appendChild(cv);
  const g = cv.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const spark = Sky.sprite();
  const sweep = 1100, parts = [];
  const N = Math.round(clamp(rect.width * rect.height / 520, 160, 380));
  const tints = ['255,255,255', '214,226,255', '232,236,247', '248,232,194'];
  for (let i = 0; i < N; i++) {
    const fy = Math.random(), y = rect.top + rect.height * fy;
    parts.push({
      x: rect.left + Math.random() * rect.width, y,
      t0: (1 - fy) * sweep * .85 + Math.random() * 160,
      life: 1400 + Math.random() * 1500,
      vx: (Math.random() - .5) * 40, vy: -(18 + Math.random() * 64),
      r: .6 + Math.pow(Math.random(), 2) * 2.2, glint: Math.random() < .16, gs: 8 + Math.random() * 11,
      tw: 3 + Math.random() * 7, ph: Math.random() * 6.283, tint: tints[(Math.random() * tints.length) | 0]
    });
  }
  const setMask = (v) => { gateCard.style.webkitMaskImage = v; gateCard.style.maskImage = v; };
  const t0 = performance.now();
  (function step(now) {
    const t = now - t0, p = clamp(t / sweep, 0, 1);
    const X = -22 + easeInOut(p) * 124;
    setMask(`linear-gradient(to top, transparent ${X.toFixed(1)}%, #000 ${(X + 22).toFixed(1)}%)`);
    gateCard.style.opacity = String(1 - clamp((p - .55) / .45, 0, 1) * .6);
    g.clearRect(0, 0, W, H);
    let alive = false;
    for (const q of parts) {
      const age = t - q.t0;
      if (age < 0) { alive = true; continue; }
      if (age > q.life) continue;
      alive = true;
      const k = age / q.life, s2 = age / 1000;
      const a = Math.min(1, age / 140) * (1 - k) * (1 - k) * (.65 + .35 * Math.sin(s2 * q.tw + q.ph));
      const x = q.x + q.vx * s2 + Math.sin(s2 * 1.8 + q.ph) * 6, y = q.y + q.vy * s2 - 12 * s2 * s2;

      } else {

        g.beginPath(); g.arc(x, y, q.r, 0, 6.283); g.fill();
      }
    }
    if (p >= 1) gateCard.style.visibility = 'hidden';
    if (alive || p < 1) requestAnimationFrame(step);
    else { cv.remove(); gate.remove(); }
  })(t0);
}

function zoomMoon() {
  const L = layout1(); state.L = L;
  const dur = reduceMotion ? 600 : 2800;
  const fromStr = Moon.cur, fromK = Moon.k, op = parseFloat(moonEl.style.opacity || '1');
  Moon.setSize(L.S, L.S * DPR);

/* =====================================================================
   CHARACTER + SPEECH BUBBLE
   ===================================================================== */
function positionBubble() {
  const g = charGeom(true), L = state.L;
  bubble.classList.remove('side');
  const sideLeft = g.x + g.s * .55, sideW = Math.min(420, W - sideLeft - 14);
  if (!L.portrait && sideW >= 240) {
    // landscape: sit beside the character, vertically centred on it
    bubble.classList.add('side');
    bubble.style.left = sideLeft + 'px'; bubble.style.maxWidth = sideW + 'px'; bubble.style.top = '0px';
    const h = bubble.offsetHeight;
    bubble.style.top = clamp(g.y - h * .45, 12, H - h - 12) + 'px';
    return;
  }
  let left = g.x + g.s * (L.portrait ? .3 : .36), maxW = Math.min(360, W - left - 14);
  if (maxW < 210) { left = Math.max(14, W - 14 - 210); maxW = W - left - 14; }
  bubble.style.left = left + 'px'; bubble.style.maxWidth = maxW + 'px'; bubble.style.top = '0px';
  const h = bubble.offsetHeight;

}

// Each line types out, then waits. A tap anywhere finishes the line instantly,
// and the next tap moves on to the following line.
function speak(text) {
  return new Promise(resolve => {
    const chars = [...text]; let i = 0, typing = true, timer = 0;
    bubble.hidden = false; bubble.classList.remove('waiting');
    bubbleGhost.textContent = text; bubbleTyped.textContent = '';
    positionBubble();
    requestAnimationFrame(() => bubble.classList.add('show'));
    const finish = () => { typing = false; clearInterval(timer); bubbleTyped.textContent = text; bubble.classList.add('waiting'); };
    const done = () => { clearInterval(timer); state.tap = null; bubble.classList.remove('waiting'); resolve(); };
    state.tap = () => { typing ? finish() : done(); };
    if (reduceMotion) finish();
    else timer = setInterval(() => { i++; bubbleTyped.textContent = chars.slice(0, i).join(''); if (i >= chars.length) finish(); }, 30);
  });
}
document.addEventListener('pointerdown', (e) => {
  if (!state.tap || e.button > 0) return;
  if (e.target && e.target.closest && e.target.closest('.sound')) return;
  state.tap();
}, true);

async function characterSay(lines) {
  state.talking = true;
  placeCharacter(false);
  charEl.classList.add('placed'); charEl.classList.remove('back');
  await nextFrame();
  charEl.classList.add('out'); state.charOut = true; placeCharacter(true);
  await wait(reduceMotion ? 200 : 900);
  for (const line of lines) await speak(line);
  bubble.classList.remove('show');
  await wait(300); bubble.hidden = true;
  charEl.classList.remove('out'); charEl.classList.add('back'); state.charOut = false; placeCharacter(false);
  await wait(750);
  state.talking = false;
}

   ===================================================================== */
function buildLevels() {
  LEVEL_NAMES.slice(0, 3).forEach((name, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'node locked'; b.style.setProperty('--i', i);
    b.innerHTML = `<span class="node-num">${['I', 'II', 'III'][i]}</span><span class="node-label">${esc(name)}</span><span class="fog" aria-hidden="true"></span><span class="done-mark">${GLINT}</span>`;
    b.addEventListener('click', () => onNode(i + 1));

}

  nodes.forEach((n, i) => {
    const lv = i + 1, locked = lv > state.unlocked, done = state.done.has(lv);
    n.classList.toggle('locked', locked); n.classList.toggle('done', done); n.classList.toggle('next', !locked && !done);
    n.setAttribute('aria-disabled', String(locked));

}

}

/* ---------------- level 1: list ---------------- */

/* ---------------- level 2: timeline ---------------- */
let io = null, tlItems = [];
function buildTimeline() {
  $('#proceedBtn').textContent = TIMELINE_CONTINUE;
  TIMELINE.forEach((mItem, i) => {
    const a = document.createElement('article'); a.className = 'tl-item';
    a.style.setProperty('--fd', (-(i % 3) * 2.2) + 's');
    const date = mItem.date ? `<p class="tl-date">${esc(mItem.date)}</p>` : '';
    const title = mItem.title ? `<h3 class="tl-title">${esc(mItem.title)}</h3>` : '';
    a.innerHTML = `<span class="tl-dot">${GLINT}</span><div class="tl-float"><div class="tl-card">${date}${title}<p class="tl-text${mItem.title ? '' : ' tl-text--lead'}">${esc(mItem.text || '')}</p></div></div>`;
    tlTrack.appendChild(a); tlItems.push(a);

function updateComet() {
  const tr = tlTrack.offsetTop, th = tlTrack.offsetHeight;
  const y = clamp(tlScroll.scrollTop + tlScroll.clientHeight * .55 - tr, 0, th);
  tlComet.style.setProperty('--comet', y.toFixed(1) + 'px');
}
function openTimeline() {
  closePanel(true);
  state.tlOpen = true; tl.hidden = false; tlScroll.scrollTop = 0;
  nodes[1].classList.add('active');
  requestAnimationFrame(() => tl.classList.add('open'));
  if (!io) {
    io = new IntersectionObserver(entries => entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    }), { root: tlScroll, threshold: .18, rootMargin: '0px 0px -6% 0px' });
    tlItems.forEach(i => io.observe(i));
  }
  updateComet();
  setTimeout(() => $('#tlBack').focus({ preventScroll: true }), 60);
}
function closeTimeline() {
  if (!state.tlOpen) return;
  state.tlOpen = false; tl.classList.remove('open'); nodes[1].classList.remove('active');
  setTimeout(() => { if (!state.tlOpen) tl.hidden = true; }, 520);
  nodes[1].focus({ preventScroll: true });
}
$('#tlBack').addEventListener('click', closeTimeline);
$('#proceedBtn').addEventListener('click', () => {
  const first = !state.done.has(2);
  state.done.add(2);
  closeTimeline();
  if (first) setTimeout(() => unlock(3), 450); else refreshNodes();
});

/* ---------------- level 3: finale ---------------- */
async function finale() {
  if (state.busy) return;
  state.busy = true; state.stage = 3;
  closePanel(true);
  nodes[2].classList.add('active');
  levelsEl.classList.remove('show');
  await wait(650);
  levelsEl.hidden = true;
  await characterSay(FINAL_LINES);
  await wait(250);
  await countdown();
}

async function countdown() {
  cdText.textContent = COUNTDOWN_TEXT; cdNum.textContent = '3';
  cd.hidden = false;
  await nextFrame();
  cd.classList.add('show');
  $('#countdown').focus?.();
  await wait(900);
  wipeNight();
  cdRing.classList.add('run');
  for (const n of [3, 2, 1]) {
    cdNum.textContent = n; cdNum.classList.remove('pop'); void cdNum.offsetWidth; cdNum.classList.add('pop');
    await wait(1000);
  }
  cdRing.classList.add('gone');
  cdText.textContent = OPEN_EYES_TEXT;
  await wait(700);
  showReveal();
  cd.classList.add('fade');
  await wait(1600);
  cd.hidden = true;
}

function wipeNight() {
  document.body.classList.add('wiping');
  setTimeout(() => {
    Sky.stop(); state.daylight = true;
    ['night', 'moon', 'character', 'bubble', 'levels', 'panelList', 'timeline', 'rosesLeft', 'rosesRight'].forEach(id => { const n = document.getElementById(id); if (n) n.remove(); });
    document.body.classList.remove('wiping'); document.body.classList.add('daylight');
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#FBF8F4');
  }, 2300);
}

function showReveal() {
  reveal.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => reveal.classList.add('bloom')));
  setTimeout(() => reveal.focus({ preventScroll: true }), 1600);
}

function loadPortrait() {
  if (portraitImg.dataset.started) return;
  portraitImg.dataset.started = '1';
  const swap = /\.jpe?g$/i.test(PORTRAIT_FILE) ? PORTRAIT_FILE.replace(/\.jpe?g$/i, '.png') : PORTRAIT_FILE.replace(/\.png$/i, '.jpg');
  const tries = [PORTRAIT_FILE, swap].filter((v, i, a) => a.indexOf(v) === i);
  let i = 0;
  portraitImg.alt = PORTRAIT_ALT;
  portraitImg.onerror = () => {
    i++;
    if (i < tries.length) portraitImg.src = tries[i];
    else { portraitImg.onerror = null; portraitImg.src = portraitPlaceholder(); portraitImg.alt = 'Portrait placeholder'; }
  };
  portraitImg.src = tries[0];
}

/* ---------------- time-lapse video popup ---------------- */
function videoEmbed(url) {
  try {
    const u = new URL(url, location.href), host = u.hostname.replace(/^(www|m)\./, '');
    let id = '';
    if (host === 'youtu.be') id = u.pathname.slice(1).split('/')[0];
    else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
      if (u.pathname === '/watch') id = u.searchParams.get('v') || '';
      else { const m = u.pathname.match(/^\/(shorts|embed|live)\/([^/?#]+)/); if (m) id = m[2]; }
    }
    if (id) return { type: 'iframe', tall: /^\/shorts\//.test(u.pathname), src: `https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0&playsinline=1` };
    if (host === 'drive.google.com') { const m = u.pathname.match(/\/file\/d\/([^/]+)/); if (m) return { type: 'iframe', src: `https://drive.google.com/file/d/${m[1]}/preview` }; }
    if (host === 'vimeo.com') { const m = u.pathname.match(/\/(\d+)/); if (m) return { type: 'iframe', src: `https://player.vimeo.com/video/${m[1]}?autoplay=1` }; }
    if (/\.(mp4|webm|mov|m4v)$/i.test(u.pathname)) return { type: 'video', src: url };
  } catch (e) {}
  return { type: 'link', src: url };
}
let musicWasOn = false;
function openLapse() {
  const v = videoEmbed(TIMELAPSE_URL);
  if (v.type === 'link') { window.open(v.src, '_blank', 'noopener'); return; }
  const frame = $('#lapseFrame');
  frame.classList.toggle('tall', TIMELAPSE_VERTICAL || !!v.tall);
  frame.innerHTML = v.type === 'iframe'
    ? `<iframe src="${esc(v.src)}" title="Time-lapse video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`
    : `<video src="${esc(v.src)}" controls autoplay playsinline></video>`;
  musicWasOn = !audio.paused;
  if (musicWasOn) fadeVolume(0, 500, () => audio.pause());
  document.body.classList.add('lapse-open');
  lapse.hidden = false; requestAnimationFrame(() => lapse.classList.add('open'));
  setTimeout(() => $('#lapseClose').focus({ preventScroll: true }), 60);
}
function closeLapse() {
  lapse.classList.remove('open'); document.body.classList.remove('lapse-open');
  setTimeout(() => { lapse.hidden = true; $('#lapseFrame').innerHTML = ''; }, 320);
  if (musicWasOn) { musicWasOn = false; audio.play().then(() => fadeVolume(MUSIC_VOLUME, 1200)).catch(() => {}); }
  $('#lapseBtn').focus({ preventScroll: true });
}
$('#lapseBtn').addEventListener('click', openLapse);
$('#lapseClose').addEventListener('click', closeLapse);
lapse.addEventListener('click', (e) => { if (e.target === lapse) closeLapse(); });

/* ---------------- global keys + resize ---------------- */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (!lapse.hidden) closeLapse();
    else if (state.tlOpen) closeTimeline();
    else if (state.panelOpen) closePanel();
  } else if ((e.key === 'Enter' || e.key === ' ') && state.tap && !(document.activeElement && document.activeElement.closest('button,input,a'))) {
    e.preventDefault(); state.tap();
  }
});

let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(onResize, 140); });
function onResize() {
  if (innerWidth === W && innerHeight === H) return;
  W = innerWidth; H = innerHeight;
  if (!state.daylight) Sky.resize();
  if (!document.getElementById('moon')) return;
  if (Moon.mode === 'arc') Moon.setSize(layout1().S, arcParams().small * DPR * 1.1);
  else if (Moon.mode === 'zoom') state.pendingResize = true;
  else { placeStage1(); if (!bubble.hidden) positionBubble(); }
}

/* ---------------- init ---------------- */
function init() {
  document.title = PAGE_TITLE;
  $('#gateQuestion').textContent = LOGIN_QUESTION;
  input.placeholder = LOGIN_PLACEHOLDER;
  $('#revealTitle').textContent = REVEAL_TITLE;
  $('#lapseLabel').textContent = TIMELAPSE_BUTTON;

  audio.src = MUSIC_FILE;
  audio.addEventListener('error', () => { soundBtn.hidden = true; });
  if (CHARACTER_FILE) { charImg.onerror = () => { charImg.onerror = null; charImg.src = CHIBI; }; charImg.src = CHARACTER_FILE; }
  else charImg.src = CHIBI;

  buildLevels(); buildList(); buildTimeline();
  buildRoses($('#rosesLeft'), 'rl', 11, false);
  buildRoses($('#rosesRight'), 'rr', 23, true);

  Sky.init();
  Moon.init();
  Moon.setSize(layout1().S, arcParams().small * DPR * 1.1);
  arcUpdate(performance.now());
  requestAnimationFrame(loop);

  if (finePointer) setTimeout(() => input.focus({ preventScroll: true }), 900);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
})();
